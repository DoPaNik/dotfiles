name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, to notice renamed or removed Homebrew formulae and casks
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh lib/*.sh steps/*.sh macos/*.sh bin/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brewfile entries exist
        run: bin/check-brewfile
      - name: Dry-run all steps
        run: ./install.sh --dry-run
